    <line x1="6" y1="14" x2="32" y2="14" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="20" y2="20" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
    <!-- Red ribbon -->
