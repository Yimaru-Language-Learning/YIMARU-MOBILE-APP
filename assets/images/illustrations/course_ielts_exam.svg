<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Light pink circular background -->
  <circle cx="50" cy="50" r="42" fill="#FFE1E6"/>

  <!-- Headphones Band (dark navy/indigo) -->
  <path d="M28 47 C28 26 72 26 72 47" fill="none" stroke="#2E2A6B" stroke-width="5" stroke-linecap="round"/>

  <!-- Headphone Earcups -->
  <rect x="23" y="43" width="8" height="16" rx="4" fill="#2E2A6B"/>
  <rect x="69" y="43" width="8" height="16" rx="4" fill="#2E2A6B"/>

  <!-- Exam Document (white paper with red header) -->
  <g transform="translate(33, 26)">
    <rect x="0" y="0" width="34" height="46" rx="4" fill="#FFFFFF"/>
    <!-- Red Top Header -->
    <path d="M0 4 C0 1.8 1.8 0 4 0 H30 C32.2 0 34 1.8 34 4 V8 H0 Z" fill="#E4002B"/>
    <!-- Text Lines -->
    <rect x="5" y="14" width="24" height="2.5" rx="1.2" fill="#FFE1E6"/>
    <rect x="5" y="20" width="18" height="2.5" rx="1.2" fill="#FFE1E6"/>
    <rect x="5" y="26" width="22" height="2.5" rx="1.2" fill="#FFE1E6"/>
    <rect x="5" y="32" width="14" height="2.5" rx="1.2" fill="#FFE1E6"/>
  </g>

  <!-- Red Pencil (writing on sheet at bottom right) -->
  <g transform="translate(62, 53) rotate(45)">
    <rect x="0" y="0" width="6" height="22" rx="1" fill="#E4002B"/>
    <polygon points="0,0 6,0 3,-6" fill="#F8BFCA"/>
    <polygon points="2,-4 4,-4 3,-6" fill="#2E2A6B"/>
  </g>
</svg>
