name: yimaru_app
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: any
  dio: ^5.9.0
  path: ^1.9.1
  pinput: ^6.0.1
  stacked: ^3.4.0
  iconsax: ^0.0.8
  flutter_svg: ^2.2.3
  stacked_shared: any
  image_picker: ^1.2.1
  battery_plus: ^7.0.0
  storage_info: ^1.0.0
  flutter_html: ^3.0.0
  email_validator: any
  firebase_core: ^4.4.0
  in_app_update: ^4.2.5
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  toastification: ^3.0.3
  dropdown_search: ^6.0.2
  json_annotation: ^4.9.0
  stacked_services: ^1.1.0
  omni_datetime_picker: any
  json_serializable: ^6.8.0
  permission_handler: ^12.0.1
  cached_network_image: ^3.4.1
  change_app_package_name: ^1.5.0
  flutter_secure_storage: ^10.0.0
  flutter_timer_countdown: ^1.0.7
  internet_connection_checker_plus: ^2.9.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.1
  build_runner: ^2.4.5
  flutter_lints: ^2.0.0
  golden_toolkit: ^0.15.0
  stacked_generator: ^1.3.3

dependency_overrides:
  intl: ^0.20.2


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Aeonik
      fonts:
        - asset: assets/fonts/Aeonik-Regular.ttf



